{% extends "base.html" %}

{% block title %}Complaint{% endblock %}

{% block start %}

<style>
/* ==========================================
   COMPLAINT FORM
========================================== */

.complaint-form select {
    width: 100%;
}

/*
   Custom dropdown wrapper
*/
.complaint-select-wrapper {
    position: relative;
    width: 100%;
}

/* Hide original select visually but keep it in the form */
.complaint-select-wrapper select {
    position: absolute;
    opacity: 0;
    pointer-events: none;
    width: 1px;
    height: 1px;
}

/* Visible replacement */
.complaint-select-trigger {
    width: 100%;
    min-height: 38px;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;

    padding: 8px 12px;

    background: #fff;
    color: #212529;

    border: 1px solid #dee2e6;
    border-radius: 6px;

    font: inherit;
    text-align: left;

    cursor: pointer;
}

.complaint-select-trigger:focus {
    border-color: #86b7fe;
    outline: 0;
    box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
}

.complaint-select-label {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.complaint-select-arrow {
    flex-shrink: 0;
    transition: transform 0.2s ease;
}

.complaint-select-wrapper.open .complaint-select-arrow {
    transform: rotate(180deg);
}


/* ==========================================
   DROPDOWN MENU
========================================== */

.complaint-select-menu {
    display: none;

    position: absolute;
    top: calc(100% + 5px);
    left: 0;
    right: 0;

    width: 100%;
    max-width: 100%;

    max-height: 240px;
    overflow-y: auto;
    overflow-x: hidden;

    padding: 5px;

    background: #fff;

    border: 1px solid #dee2e6;
    border-radius: 7px;

    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);

    z-index: 1050;
}

.complaint-select-wrapper.open .complaint-select-menu {
    display: block;
}

.complaint-select-option {
    display: block;

    width: 100%;
    padding: 9px 10px;

    background: transparent;
    border: 0;
    border-radius: 5px;

    color: #212529;
    font: inherit;
    text-align: left;

    cursor: pointer;

    white-space: normal;
    overflow-wrap: anywhere;
}

.complaint-select-option:hover {
    background: #f1f5f9;
}

.complaint-select-option.selected {
    background: #e7f3ff;
    color: #0d6efd;
}


/* ==========================================
   MOBILE
========================================== */

@media (max-width: 576px) {

    .complaint-select-menu {
        max-height: 210px;
    }

    .complaint-select-trigger,
    .complaint-select-option {
        font-size: 14px;
    }
}
</style>


<div class="container mt-4">

    <div class="card shadow">

        <div class="card-body">

            <h3>
                {% if edit %}
                    Edit Complaint
                {% else %}
                    Submit Complaint
                {% endif %}
            </h3>

            <form
                method="POST"
                enctype="multipart/form-data"
                class="complaint-form"
                id="complaintForm"
            >

                {% csrf_token %}

                {{ form.as_p }}

                <button class="btn btn-dark">
                    {% if edit %}
                        Update Complaint
                    {% else %}
                        Submit Complaint
                    {% endif %}
                </button>

            </form>

        </div>

    </div>

</div>


<script>
document.addEventListener("DOMContentLoaded", function () {

    const form = document.getElementById("complaintForm");

    if (!form) return;

    /*
       Enhance only:
       - Order
       - Complaint Type

       Django normally creates:
       id_order
       id_complaint_type
    */
    const selectIds = [
        "id_order",
        "id_complaint_type"
    ];

    selectIds.forEach(function (selectId) {

        const select = document.getElementById(selectId);

        if (!select) return;

        createCustomSelect(select);
    });


    function createCustomSelect(select) {

        /* ----------------------------------
           Build wrapper
        ---------------------------------- */

        const wrapper = document.createElement("div");
        wrapper.className = "complaint-select-wrapper";


        /* ----------------------------------
           Build trigger
        ---------------------------------- */

        const trigger = document.createElement("button");

        trigger.type = "button";
        trigger.className = "complaint-select-trigger";
        trigger.setAttribute("aria-expanded", "false");


        const label = document.createElement("span");
        label.className = "complaint-select-label";


        const selectedOption =
            select.options[select.selectedIndex];

        label.textContent =
            selectedOption
                ? selectedOption.text
                : "Select";


        const arrow = document.createElement("span");
        arrow.className = "complaint-select-arrow";

        arrow.innerHTML = `
            <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
            >
                <polyline
                    points="6 9 12 15 18 9"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />
            </svg>
        `;


        trigger.appendChild(label);
        trigger.appendChild(arrow);


        /* ----------------------------------
           Build menu
        ---------------------------------- */

        const menu = document.createElement("div");
        menu.className = "complaint-select-menu";


        Array.from(select.options).forEach(function (option) {

            const button =
                document.createElement("button");

            button.type = "button";

            button.className =
                "complaint-select-option";

            button.textContent = option.text;

            button.dataset.value = option.value;


            if (option.selected) {
                button.classList.add("selected");
            }


            button.addEventListener(
                "click",
                function () {

                    /*
                       Update REAL Django select
                    */
                    select.value =
                        this.dataset.value;

                    /*
                       Update visible text
                    */
                    label.textContent =
                        this.textContent;

                    /*
                       Selected styling
                    */
                    menu
                        .querySelectorAll(
                            ".complaint-select-option"
                        )
                        .forEach(function (item) {
                            item.classList.remove(
                                "selected"
                            );
                        });

                    this.classList.add("selected");


                    /*
                       Tell Django/other JS
                       that the field changed
                    */
                    select.dispatchEvent(
                        new Event(
                            "change",
                            { bubbles: true }
                        )
                    );


                    closeDropdown();
                }
            );


            menu.appendChild(button);
        });


        /* ----------------------------------
           Insert custom dropdown
        ---------------------------------- */

        select.parentNode.insertBefore(
            wrapper,
            select
        );

        wrapper.appendChild(select);
        wrapper.appendChild(trigger);
        wrapper.appendChild(menu);


        /* ----------------------------------
           Open / close
        ---------------------------------- */

        trigger.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();

                /*
                   Close any other dropdown
                */
                document
                    .querySelectorAll(
                        ".complaint-select-wrapper.open"
                    )
                    .forEach(function (other) {

                        if (other !== wrapper) {
                            other.classList.remove(
                                "open"
                            );

                            const otherTrigger =
                                other.querySelector(
                                    ".complaint-select-trigger"
                                );

                            if (otherTrigger) {
                                otherTrigger.setAttribute(
                                    "aria-expanded",
                                    "false"
                                );
                            }
                        }
                    });


                const opened =
                    wrapper.classList.toggle("open");

                trigger.setAttribute(
                    "aria-expanded",
                    opened ? "true" : "false"
                );
            }
        );


        function closeDropdown() {

            wrapper.classList.remove("open");

            trigger.setAttribute(
                "aria-expanded",
                "false"
            );
        }
    }


    /* ======================================
       CLICK OUTSIDE
    ====================================== */

    document.addEventListener(
        "click",
        function (event) {

            document
                .querySelectorAll(
                    ".complaint-select-wrapper.open"
                )
                .forEach(function (wrapper) {

                    if (!wrapper.contains(event.target)) {

                        wrapper.classList.remove("open");

                        const trigger =
                            wrapper.querySelector(
                                ".complaint-select-trigger"
                            );

                        if (trigger) {
                            trigger.setAttribute(
                                "aria-expanded",
                                "false"
                            );
                        }
                    }
                });
        }
    );


    /* ======================================
       ESCAPE
    ====================================== */

    document.addEventListener(
        "keydown",
        function (event) {

            if (event.key !== "Escape") return;

            document
                .querySelectorAll(
                    ".complaint-select-wrapper.open"
                )
                .forEach(function (wrapper) {

                    wrapper.classList.remove("open");

                    const trigger =
                        wrapper.querySelector(
                            ".complaint-select-trigger"
                        );

                    if (trigger) {
                        trigger.setAttribute(
                            "aria-expanded",
                            "false"
                        );
                    }
                });
        }
    );

});
</script>

{% endblock %}
