{% extends 'base.html' %} {% block title %}Logged Out — ShopMart{% endblock %}
{% block start %}

<div
  style="
    min-height: 60vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  "
>
  <div
    style="
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 48px 40px;
      text-align: center;
      max-width: 420px;
      width: 100%;
    "
  >
    <div
      style="
        width: 72px;
        height: 72px;
        background: #f0f9ff;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
      "
    >
      <svg
        width="30"
        height="30"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#0ea5e9"
        stroke-width="1.8"
      >
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" y1="12" x2="9" y2="12" />
      </svg>
    </div>
    <h4 style="font-weight: 700; margin-bottom: 8px; color: #0e3a5c">
      You've been logged out
    </h4>
    <p style="color: #6b7280; margin-bottom: 28px; font-size: 14px">
      Thanks for visiting ShopMart. See you again soon!
    </p>
    <a
      href="{% url 'login' %}"
      style="
        display: block;
        width: 100%;
        padding: 12px;
        background: #0e3a5c;
        color: #fff;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 700;
        font-size: 15px;
        margin-bottom: 10px;
        transition: background 0.2s;
      "
      onmouseover="this.style.background = '#1e5a8a'"
      onmouseout="this.style.background = '#0e3a5c'"
    >
      Login Again
    </a>
    <a
      href="{% url 'products:view_products' %}"
      style="
        display: block;
        width: 100%;
        padding: 12px;
        background: #fff;
        color: #374151;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
      "
    >
      Continue Browsing
    </a>
  </div>
</div>

{% endblock %}
