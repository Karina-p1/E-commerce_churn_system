{% extends 'base.html' %}
{% block title %}Logged Out — ShopMart{% endblock %}

{% block extra_head %}
<style>
  .brand-strip-wrapper, .cat-bar { display: none !important; }
  body { padding-top: 60px !important; }

  .logout-root {
    min-height: calc(100vh - 60px);
    display: flex; align-items: center; justify-content: center;
    background: #f8fafc; padding: 40px 16px;
  }
  .logout-card {
    background: #fff; border: 1px solid #e5e7eb;
    border-radius: 16px; padding: 52px 44px;
    text-align: center; max-width: 400px; width: 100%;
    box-shadow: 0 4px 24px rgba(14,58,92,0.07);
  }
  .logout-icon {
    width: 76px; height: 76px;
    background: linear-gradient(135deg, #e0f2fe, #bae6fd);
    border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    margin-bottom: 24px;
  }
  .logout-card h3 {
    font-size: 22px; font-weight: 800;
    color: #0e3a5c; margin: 0 0 8px;
  }
  .logout-card p {
    font-size: 14px; color: #6b7280;
    margin: 0 0 32px; line-height: 1.6;
  }
  .btn-login-again {
    display: block; width: 100%; padding: 13px;
    background: #0e3a5c; color: #fff;
    border-radius: 8px; text-decoration: none;
    font-size: 15px; font-weight: 700;
    font-family: "DM Sans", sans-serif;
    margin-bottom: 10px;
    transition: background 0.2s;
  }
  .btn-login-again:hover { background: #1e5a8a; color: #fff; }
  .btn-browse {
    display: block; width: 100%; padding: 12px;
    background: #fff; color: #374151;
    border: 1.5px solid #e5e7eb; border-radius: 8px;
    text-decoration: none; font-size: 14px; font-weight: 600;
    font-family: "DM Sans", sans-serif;
    transition: border-color 0.2s, background 0.2s;
  }
  .btn-browse:hover { border-color: #9ca3af; background: #f9fafb; color: #374151; }
</style>
{% endblock %}

{% block start %}
<div class="logout-root">
  <div class="logout-card">
    <div class="logout-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0ea5e9" stroke-width="1.8">
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </div>
    <h3>You've been signed out</h3>
    <p>Thanks for shopping with ShopMart.<br>See you again soon!</p>
    <a href="{% url 'login' %}" class="btn-login-again">Sign back in</a>
    <a href="{% url 'products:view_products' %}" class="btn-browse">Continue browsing</a>
  </div>
</div>
{% endblock %}
