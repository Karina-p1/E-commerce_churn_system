{% extends 'admin_base.html' %}
{% block title %}Edit Product - ShopMart Admin{% endblock %}

{% block start %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

<style>
  .edit-page { font-family: 'Segoe UI', system-ui, sans-serif; background: #f5f5f4; padding: 20px; border-radius: 12px; color: #1a1a1a; }
  .edit-header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .back-link { width: 32px; height: 32px; border-radius: 8px; background: #fff; border: 0.5px solid #e5e5e5; display: flex; align-items: center; justify-content: center; color: #888; text-decoration: none; }
  .back-link:hover { background: #f0f0f0; color: #1a1a1a; }
  .edit-header h1 { font-size: 18px; font-weight: 500; margin: 0; }

  .edit-card { background: #fff; border: 0.5px solid #e5e5e5; border-radius: 10px; padding: 22px; max-width: 640px; }

  .form-row { margin-bottom: 16px; }
  .form-row label { display: block; font-size: 12px; font-weight: 600; color: #666; margin-bottom: 6px; }
  .form-row input[type="text"],
  .form-row input[type="number"],
  .form-row textarea,
  .form-row select {
    width: 100%;
    padding: 9px 11px;
    border: 0.5px solid #d4d4d4;
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    color: #1a1a1a;
    box-sizing: border-box;
  }
  .form-row input:focus, .form-row textarea:focus, .form-row select:focus {
    outline: none;
    border-color: #2931a3;
  }
  .form-row textarea { resize: vertical; min-height: 80px; }

  .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .current-image { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .current-image img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; border: 0.5px solid #e5e5e5; }
  .current-image span { font-size: 11px; color: #888; }

  .checkbox-row { display: flex; align-items: center; gap: 8px; }
  .checkbox-row input { width: auto; }
  .checkbox-row label { margin: 0; font-size: 13px; font-weight: 500; color: #1a1a1a; }

  .form-actions { display: flex; gap: 10px; margin-top: 22px; }
  .btn { padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; text-decoration: none; text-align: center; cursor: pointer; border: none; }
  .btn-primary { background: #2931a3; color: #fff; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-secondary { background: #f5f5f4; border: 0.5px solid #d4d4d4; color: #1a1a1a; }
  .btn-secondary:hover { background: #ececeb; }
</style>

<div class="edit-page">

  <div class="edit-header">
    <a href="{% url 'products:product_list' %}" class="back-link"><i class="ti ti-arrow-left"></i></a>
    <h1>Edit Product</h1>
  </div>

  <div class="edit-card">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}

      {% if product.image %}
      <div class="current-image">
        <img src="{{ product.image.url }}" alt="{{ product.name }}">
        <span>Current image</span>
      </div>
      {% endif %}

      <div class="form-row">
        <label for="name">Product name</label>
        <input type="text" id="name" name="name" value="{{ product.name }}" required>
      </div>

      <div class="form-row">
        <label for="description">Description</label>
        <textarea id="description" name="description">{{ product.description }}</textarea>
      </div>

      <div class="form-grid-2">
        <div class="form-row">
          <label for="category">Category</label>
          <select id="category" name="category" required>
            {% for c in categories %}
              <option value="{{ c.pk }}" {% if c.pk == product.category_id %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-row">
          <label for="brand">Brand</label>
          <select id="brand" name="brand">
            <option value="">No brand</option>
            {% for b in brands %}
              <option value="{{ b.pk }}" {% if b.pk == product.brand_id %}selected{% endif %}>{{ b.name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="form-grid-2">
        <div class="form-row">
          <label for="price">Price (Rs.)</label>
          <input type="number" step="0.01" id="price" name="price" value="{{ product.price }}" required>
        </div>
        <div class="form-row">
          <label for="discount_price">Discount price (Rs.)</label>
          <input type="number" step="0.01" id="discount_price" name="discount_price" value="{{ product.discount_price|default:'' }}">
        </div>
      </div>

      <div class="form-grid-2">
        <div class="form-row">
          <label for="stock">Stock</label>
          <input type="number" id="stock" name="stock" value="{{ product.stock }}" required>
        </div>
        <div class="form-row">
          <label for="image">Replace image</label>
          <input type="file" id="image" name="image" accept="image/*">
        </div>
      </div>

      <div class="form-row checkbox-row">
        <input type="checkbox" id="is_active" name="is_active" {% if product.is_active %}checked{% endif %}>
        <label for="is_active">Active (visible to customers)</label>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save changes</button>
        <a href="{% url 'products:product_list' %}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>

</div>
{% endblock %}
