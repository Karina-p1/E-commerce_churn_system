<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopAdmin — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f7f0;
    --bg2: #ffffff;
    --bg3: #eef3e8;
    --border: #dde8d4;
    --text: #1a2214;
    --muted: #7a8f6e;
    --accent: #2931a3;
    --accent-light: rgba(58,140,28,0.1);
    --accent2: #d4900a;
    --accent2-light: rgba(212,144,10,0.1);
    --blue: #1a7ab5;
    --blue-light: rgba(26,122,181,0.1);
    --danger: #d63b3b;
    --danger-light: rgba(214,59,59,0.1);
    --warn: #d4680a;
    --warn-light: rgba(212,104,10,0.1);
    --card-r: 14px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; font-size: 14px; }
 
  /* SIDEBAR */
  .sidebar { width: 220px; min-height: 100vh; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 24px 0; position: fixed; top: 0; left: 0; }
  .logo { padding: 0 20px 28px; font-size: 20px; font-weight: 800; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; color: var(--text); }
  .logo-icon { width: 30px; height: 30px; background: var(--accent); border-radius: 7px; display: flex; align-items: center; justify-content: center; }
  .logo-icon svg { width: 18px; height: 18px; color: #fff; }
  .logo span { color: var(--accent); }
  .nav-section { padding: 0 12px 20px; }
  .nav-label { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; padding: 0 8px 8px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 8px; border-radius: 8px; color: var(--muted); cursor: pointer; transition: all 0.15s; font-size: 13.5px; font-weight: 500; margin-bottom: 2px; text-decoration: none; }
  .nav-item:hover { background: var(--bg3); color: var(--text); }
  .nav-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .nav-item.active { background: var(--accent-light); color: var(--accent); }
  .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
  .nav-badge { margin-left: auto; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 20px; }
  .admin-toggle { width: 100%; border: 0; background: transparent; font-family: inherit; }
  .admin-toggle .chevron { margin-left: auto; font-size: 11px; transition: transform 0.15s ease; }
  .admin-toggle.open .chevron { transform: rotate(180deg); }
  .admin-menu { display: none; margin: 4px 0 8px 26px; border-left: 1px solid var(--border); padding-left: 8px; }
  .admin-menu.show { display: block; }
  .admin-menu .nav-item { font-size: 12.5px; padding: 8px; }
 
  /* MAIN */
  .main { margin-left: 220px; flex: 1; padding: 28px 32px; min-height: 100vh; }
  .topbar { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 28px; }
  .page-title h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; color: var(--text); }
  .page-title p { color: var(--muted); font-size: 12px; margin-top: 3px; font-family: 'Space Mono', monospace; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .date-btn { display: flex; align-items: center; gap: 7px; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--text); font-family: 'Outfit', sans-serif; }
  .date-btn svg { width: 14px; height: 14px; color: var(--muted); }
  .promo-badge { background: var(--accent-light); border: 1px solid rgba(58,140,28,0.2); color: var(--accent); font-size: 12px; font-weight: 600; padding: 8px 14px; border-radius: 8px; display: flex; align-items: center; gap: 6px; }
  .promo-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
 
  /* KPI CARDS */
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
  .kpi-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--card-r); padding: 20px 22px; position: relative; overflow: hidden; }
  .kpi-card::before { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px; }
  .kpi-card.revenue::before { background: var(--accent); }
  .kpi-card.orders::before { background: var(--accent2); }
  .kpi-card.customers::before { background: var(--blue); }
  .kpi-card.avg::before { background: var(--warn); }
  .kpi-icon { width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
  .kpi-icon.green { background: var(--accent-light); color: var(--accent); }
  .kpi-icon.yellow { background: var(--accent2-light); color: var(--accent2); }
  .kpi-icon.blue { background: var(--blue-light); color: var(--blue); }
  .kpi-icon.orange { background: var(--warn-light); color: var(--warn); }
  .kpi-icon svg { width: 18px; height: 18px; }
  .kpi-label { font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: 0.4px; text-transform: uppercase; margin-bottom: 6px; }
  .kpi-value { font-size: 28px; font-weight: 800; letter-spacing: -1px; line-height: 1; margin-bottom: 8px; font-family: 'Space Mono', monospace; color: var(--text); }
  .kpi-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 20px; font-family: 'Space Mono', monospace; }
  .kpi-badge.up { background: var(--accent-light); color: var(--accent); }
  .kpi-badge.down { background: var(--danger-light); color: var(--danger); }
 
  /* CHART + TOP PRODUCTS */
  .mid-grid { display: grid; grid-template-columns: 1fr 290px; gap: 16px; margin-bottom: 20px; }
  .chart-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--card-r); padding: 24px; }
  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .card-title { font-size: 15px; font-weight: 700; color: var(--text); }
  .legend { display: flex; gap: 16px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
 
  /* Bar chart */
  .bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 140px; }
  .bar-group { flex: 1; display: flex; gap: 3px; align-items: flex-end; }
  .bar { flex: 1; border-radius: 4px 4px 0 0; transition: opacity 0.2s; }
  .bar:hover { opacity: 0.8; }
  .bar.current { background: var(--accent); }
  .bar.prev { background: var(--border); }
  .chart-labels { display: flex; gap: 8px; margin-top: 8px; }
  .chart-label { flex: 1; text-align: center; font-size: 10.5px; color: var(--muted); font-family: 'Space Mono', monospace; }
 
  /* Top products */
  .products-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--card-r); padding: 24px; }
  .product-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .product-item:last-child { border-bottom: none; padding-bottom: 0; }
  .product-item:first-child { padding-top: 0; }
  .product-icon { width: 36px; height: 36px; border-radius: 8px; background: var(--bg3); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .product-info { flex: 1; min-width: 0; }
  .product-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .product-cat { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .product-rev { font-size: 13px; font-weight: 700; color: var(--accent); font-family: 'Space Mono', monospace; }
 
  /* ORDERS TABLE */
  .orders-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--card-r); padding: 24px; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; }
  thead th { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; padding: 0 12px 12px; text-align: left; }
  tbody tr { border-top: 1px solid var(--border); transition: background 0.12s; }
  tbody tr:hover { background: var(--bg3); }
  td { padding: 13px 12px; font-size: 13px; color: var(--text); }
  .order-id { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted); }
  .status-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .status-badge.delivered { background: var(--accent-light); color: var(--accent); }
  .status-badge.processing { background: var(--blue-light); color: var(--blue); }
  .status-badge.pending { background: var(--warn-light); color: var(--warn); }
  .status-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
 
  /* BOTTOM GRID */
  .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .channel-card, .stock-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--card-r); padding: 24px; }
 
  /* Donut */
  .donut-wrap { display: flex; align-items: center; gap: 28px; margin-top: 16px; }
  .donut-svg { flex-shrink: 0; }
  .donut-legend { display: flex; flex-direction: column; gap: 10px; }
  .dl-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); }
  .dl-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .dl-pct { margin-left: auto; font-weight: 700; font-family: 'Space Mono', monospace; color: var(--text); }
 
  /* Stock */
  .stock-item { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--border); }
  .stock-item:last-of-type { border-bottom: none; }
  .stock-name { font-size: 13px; font-weight: 500; color: var(--text); }
  .stock-left { font-size: 12.5px; font-weight: 700; font-family: 'Space Mono', monospace; }
  .stock-left.critical { color: var(--danger); }
  .stock-left.low { color: var(--warn); }
  .stock-bar-bg { height: 4px; border-radius: 2px; background: var(--border); margin-top: 4px; width: 100%; }
  .stock-bar-fill { height: 4px; border-radius: 2px; }
  .restock-btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; margin-top: 16px; padding: 10px; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--text); cursor: pointer; transition: all 0.15s; font-family: 'Outfit', sans-serif; }
  .restock-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .badge-red { background: var(--danger); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
 
  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>
<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="logo"><span>Shop</span>admin</div>
  <nav>
    <div class="nav-section">
      <div class="nav-label">Overview</div>

      <a href="{% url 'admin_dashboard' %}"
        class="nav-item {% if request.resolver_match.url_name == 'admin_dashboard' %}active{% endif %}">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        Dashboard
      </a>
    </div>
    <div class="nav-section">
      <div class="nav-label">Finance</div>
      <a href="{% url 'analytics' %}"
        class="nav-item {% if request.resolver_match.url_name == 'analytics' %}active{% endif %}">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        Analytics
      </a>
    </div>
    {% if request.user.is_staff %}
    <div class="nav-section">
      <div class="nav-label">System</div>
      <a href="{% url 'admin_profile' %}"
        class="nav-item {% if request.resolver_match.url_name == 'admin_profile' %}active{% endif %}">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Profile
      </a>
      <button type="button" onclick="toggleAdminMenu()" class="nav-item admin-toggle" id="admin-toggle">
        <svg fill="none" stroke="#f59e0b" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.07 4.93a10 10 0 010 14.14M4.93 4.93a10 10 0 000 14.14"/>
        </svg>
        Admin
        <span class="chevron">v</span>
      </button>
      <div id="admin-menu" class="admin-menu">
        <a href="/admin/" class="nav-item {% if request.path|slice:':7' == '/admin/' %}active{% endif %}">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
          </svg>
          Django Admin
        </a>

        <a href="{% url 'churn:dashboard' %}" class="nav-item {% if request.resolver_match.namespace == 'churn' %}active{% endif %}">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>
          </svg>
          Churn Dashboard
        </a>
      </div>
    </div>
    {% endif %}
  </nav>
</aside>
{% block start %}{% endblock %}
<script>
  function toggleAdminMenu() {
    const adminMenu = document.getElementById("admin-menu");
    const adminToggle = document.getElementById("admin-toggle");

    if (!adminMenu || !adminToggle) return;

    adminMenu.classList.toggle("show");
    adminToggle.classList.toggle("open");
  }
</script>
</body>
</html>
